<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" style="background:#fbf8f1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradInput" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f2ebe0"/>
    </linearGradient>
    <linearGradient id="gradConv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef6f6"/>
      <stop offset="100%" stop-color="#fae3e3"/>
    </linearGradient>
    <linearGradient id="gradDense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#fce9cf"/>
    </linearGradient>
    <linearGradient id="gradOutput" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9f3"/>
      <stop offset="100%" stop-color="#d8eedf"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a1c1c" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="8" y="8" width="1184" height="434" rx="10" fill="#ffffff" stroke="#e6decb" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="36" y="44" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#1f1a14">FireCNN: 3-Stage Convolutional Architecture</text>
  <text x="36" y="68" font-family="monospace" font-size="11" fill="#635b50">INPUT: 128×128×3 RGB ➔ 3 CONV BLOCKS ➔ 512 LATENT DENSE HEAD (p=0.5) ➔ 1 BINARY LOGIT</text>
  
  <rect x="990" y="26" width="170" height="30" rx="15" fill="#f4eedf" stroke="#e0d6c3" stroke-width="1"/>
  <text x="1075" y="46" font-family="monospace" font-size="11" font-weight="700" fill="#8a1c1c" text-anchor="middle">SUB-15ms LOCAL INFERENCE</text>

  <!-- ==================== STAGE 00: INPUT ==================== -->
  <g transform="translate(35, 100)">
    <rect x="0" y="0" width="150" height="280" rx="8" fill="url(#gradInput)" stroke="#dcd3c0" stroke-width="1.5"/>
    <rect x="12" y="12" width="126" height="22" rx="4" fill="#ede4d4"/>
    <text x="75" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#4d4438" text-anchor="middle">STAGE 00 · INPUT</text>

    <!-- Visual Layer Representation -->
    <rect x="25" y="50" width="100" height="100" rx="4" fill="#fdfcf9" stroke="#b0a592" stroke-width="1.5"/>
    <text x="75" y="100" font-size="13" font-weight="700" fill="#1f1a14" text-anchor="middle">128 × 128</text>
    <text x="75" y="120" font-size="10" fill="#635b50" text-anchor="middle">3 Channels (RGB)</text>

    <text x="75" y="174" font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">Aerial Image Tile</text>
    <text x="75" y="194" font-size="9.5" fill="#635b50" text-anchor="middle">Zero-Mean Norm</text>
    <text x="75" y="210" font-size="9.5" fill="#635b50" text-anchor="middle">Contrast Standardized</text>

    <rect x="16" y="240" width="118" height="24" rx="4" fill="#ffffff" stroke="#e0d6c3" stroke-width="1"/>
    <text x="75" y="256" font-family="monospace" font-size="10" font-weight="600" fill="#635b50" text-anchor="middle">0 parameters</text>
  </g>

  <!-- Connection 0 -> 1 -->
  <line x1="185" y1="240" x2="225" y2="240" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 01: CONV 1 ==================== -->
  <g transform="translate(230, 100)">
    <rect x="0" y="0" width="155" height="280" rx="8" fill="url(#gradConv)" stroke="#ebc4c4" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="22" rx="4" fill="#f7d4d4"/>
    <text x="77" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#8a1c1c" text-anchor="middle">STAGE 01 · CONV 1</text>

    <!-- Visual Layer Representation -->
    <rect x="35" y="58" width="85" height="85" rx="4" fill="#ffffff" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="77" y="100" font-size="13" font-weight="700" fill="#8a1c1c" text-anchor="middle">64 × 64</text>
    <text x="77" y="118" font-size="10" fill="#635b50" text-anchor="middle">32 Feature Maps</text>

    <text x="77" y="168" font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">Edge &amp; Ridge Contours</text>
    <text x="77" y="186" font-size="9.5" fill="#52483d" text-anchor="middle">32 filters (3×3) · ReLU</text>
    <text x="77" y="202" font-size="9.5" fill="#52483d" text-anchor="middle">2×2 MaxPool (stride 2)</text>
    <text x="77" y="218" font-size="9.5" fill="#8a1c1c" text-anchor="middle">Horizon Contrast Edges</text>

    <rect x="16" y="240" width="123" height="24" rx="4" fill="#ffffff" stroke="#e0c0c0" stroke-width="1"/>
    <text x="77" y="256" font-family="monospace" font-size="10" font-weight="600" fill="#1e5c38" text-anchor="middle">&lt; 1.0 ms · 896 p</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <line x1="385" y1="240" x2="425" y2="240" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 02: CONV 2 ==================== -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="155" height="280" rx="8" fill="url(#gradConv)" stroke="#ebc4c4" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="22" rx="4" fill="#f7d4d4"/>
    <text x="77" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#8a1c1c" text-anchor="middle">STAGE 02 · CONV 2</text>

    <!-- Visual Layer Representation -->
    <rect x="45" y="68" width="65" height="65" rx="4" fill="#ffffff" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="77" y="101" font-size="13" font-weight="700" fill="#8a1c1c" text-anchor="middle">32 × 32</text>
    <text x="77" y="119" font-size="10" fill="#635b50" text-anchor="middle">64 Feature Maps</text>

    <text x="77" y="168" font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">Smoke Plume Texture</text>
    <text x="77" y="186" font-size="9.5" fill="#52483d" text-anchor="middle">64 filters (3×3) · ReLU</text>
    <text x="77" y="202" font-size="9.5" fill="#52483d" text-anchor="middle">2×2 MaxPool (stride 2)</text>
    <text x="77" y="218" font-size="9.5" fill="#8a1c1c" text-anchor="middle">Turbulent Gradient Flow</text>

    <rect x="16" y="240" width="123" height="24" rx="4" fill="#ffffff" stroke="#e0c0c0" stroke-width="1"/>
    <text x="77" y="256" font-family="monospace" font-size="10" font-weight="600" fill="#1e5c38" text-anchor="middle">2.1 ms · 18.5K p</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <line x1="585" y1="240" x2="625" y2="240" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 03: CONV 3 ==================== -->
  <g transform="translate(630, 100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="url(#gradConv)" stroke="#ebc4c4" stroke-width="1.5"/>
    <rect x="12" y="12" width="136" height="22" rx="4" fill="#f7d4d4"/>
    <text x="80" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#8a1c1c" text-anchor="middle">STAGE 03 · CONV 3</text>

    <!-- Visual Layer Representation -->
    <rect x="55" y="78" width="50" height="50" rx="4" fill="#ffffff" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="80" y="103" font-size="12" font-weight="700" fill="#8a1c1c" text-anchor="middle">16 × 16</text>
    <text x="80" y="119" font-size="10" fill="#635b50" text-anchor="middle">128 Maps</text>

    <text x="80" y="168" font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">Combustion Semantics</text>
    <text x="80" y="186" font-size="9.5" fill="#52483d" text-anchor="middle">128 filters (3×3) · ReLU</text>
    <text x="80" y="202" font-size="9.5" fill="#52483d" text-anchor="middle">2×2 MaxPool (stride 2)</text>
    <text x="80" y="218" font-size="9.5" fill="#8a1c1c" text-anchor="middle">Separates Smoke vs Fog</text>

    <rect x="16" y="240" width="128" height="24" rx="4" fill="#ffffff" stroke="#e0c0c0" stroke-width="1"/>
    <text x="80" y="256" font-family="monospace" font-size="10" font-weight="600" fill="#1e5c38" text-anchor="middle">3.2 ms · 73.8K p</text>
  </g>

  <!-- Connection 3 -> 4 -->
  <line x1="790" y1="240" x2="825" y2="240" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 04: DENSE HEAD ==================== -->
  <g transform="translate(830, 100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="url(#gradDense)" stroke="#edd7b6" stroke-width="1.5"/>
    <rect x="12" y="12" width="136" height="22" rx="4" fill="#fcecd4"/>
    <text x="80" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#b26818" text-anchor="middle">STAGE 04 · DENSE HEAD</text>

    <!-- Visual Layer Representation -->
    <rect x="66" y="58" width="28" height="90" rx="4" fill="#ffffff" stroke="#b26818" stroke-width="1.5"/>
    <line x1="66" y1="78" x2="94" y2="78" stroke="#f0d5af"/>
    <line x1="66" y1="98" x2="94" y2="98" stroke="#f0d5af"/>
    <line x1="66" y1="118" x2="94" y2="118" stroke="#f0d5af"/>
    <line x1="66" y1="133" x2="94" y2="133" stroke="#f0d5af"/>
    <text x="80" y="105" font-size="12" font-weight="700" fill="#b26818" text-anchor="middle">512</text>

    <text x="80" y="168" font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">Flatten &amp; Dropout</text>
    <text x="80" y="186" font-size="9.5" fill="#52483d" text-anchor="middle">Flatten: 32,768 units</text>
    <text x="80" y="202" font-size="9.5" font-weight="700" fill="#b26818" text-anchor="middle">Dropout (p = 0.5)</text>
    <text x="80" y="218" font-size="9.5" fill="#52483d" text-anchor="middle">Breaks Overfitting</text>

    <rect x="16" y="240" width="128" height="24" rx="4" fill="#ffffff" stroke="#e0ceb5" stroke-width="1"/>
    <text x="80" y="256" font-family="monospace" font-size="10" font-weight="600" fill="#1e5c38" text-anchor="middle">4.4 ms · 16.7M p</text>
  </g>

  <!-- Connection 4 -> 5 -->
  <line x1="990" y1="240" x2="1025" y2="240" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 05: LOGITS ==================== -->
  <g transform="translate(1030, 100)">
    <rect x="0" y="0" width="135" height="280" rx="8" fill="url(#gradOutput)" stroke="#bfe3cb" stroke-width="1.5"/>
    <rect x="12" y="12" width="111" height="22" rx="4" fill="#d2edd9"/>
    <text x="67" y="27" font-family="monospace" font-size="10" font-weight="700" fill="#1e5c38" text-anchor="middle">STAGE 05 · LOGIT</text>

    <!-- Visual Output Representation -->
    <circle cx="67" cy="103" r="28" fill="#ffffff" stroke="#1e5c38" stroke-width="2"/>
    <text x="67" y="108" font-size="14" font-weight="700" fill="#1e5c38" text-anchor="middle">P(fire)</text>

    <text x="67" y="168" font-size="11" font-weight="700" fill="#1f1a14" text-anchor="middle">Binary Probability</text>
    <text x="67" y="186" font-size="9.5" fill="#52483d" text-anchor="middle">Linear(512 ➔ 1)</text>
    <text x="67" y="202" font-size="9.5" fill="#52483d" text-anchor="middle">Sigmoid Calibration</text>
    <text x="67" y="218" font-size="9.5" font-weight="700" fill="#1e5c38" text-anchor="middle">Local Verification</text>

    <rect x="12" y="240" width="111" height="24" rx="4" fill="#ffffff" stroke="#bedec7" stroke-width="1"/>
    <text x="67" y="256" font-family="monospace" font-size="10" font-weight="600" fill="#1e5c38" text-anchor="middle">&lt; 1.0 ms · 513 p</text>
  </g>

  <!-- Bottom Footprint Legend Bar -->
  <line x1="35" y1="400" x2="1165" y2="400" stroke="#eee7d7" stroke-width="1"/>
  <text x="40" y="422" font-family="monospace" font-size="10.5" font-weight="600" fill="#635b50">TOTAL PARAMETERS: 16.8M (33.9 MB MEMORY FOOTPRINT)</text>
  <text x="460" y="422" font-family="monospace" font-size="10.5" font-weight="600" fill="#1e5c38">TOTAL INFERENCE LATENCY: 14.8 ms (67.5 FPS ON MPS)</text>
  <text x="965" y="422" font-family="monospace" font-size="10.5" font-weight="600" fill="#8a1c1c">TARGET: LOCAL ZERO-UPLINK</text>
</svg>
