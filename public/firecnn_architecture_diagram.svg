<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" width="800" height="224" style="background:#fdfcf9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft 3D drop shadow -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2a1808" flood-opacity="0.08"/>
    </filter>
    <filter id="glowGreen" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e5c38" flood-opacity="0.22"/>
    </filter>

    <!-- 3D Gradients -->
    <!-- Input 128x128x3 -->
    <linearGradient id="inputFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6efe5"/>
    </linearGradient>
    <linearGradient id="inputTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#ede3d1"/>
    </linearGradient>
    <linearGradient id="inputSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eae0cf"/>
      <stop offset="100%" stop-color="#dbccb4"/>
    </linearGradient>

    <!-- Conv 1: 64x64x32 -->
    <linearGradient id="c1Front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fce5e5"/>
    </linearGradient>
    <linearGradient id="c1Top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcdcdc"/>
    </linearGradient>
    <linearGradient id="c1Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c4c4"/>
      <stop offset="100%" stop-color="#e8a7a7"/>
    </linearGradient>

    <!-- Conv 2: 32x32x64 -->
    <linearGradient id="c2Front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8e8"/>
      <stop offset="100%" stop-color="#f8c8c8"/>
    </linearGradient>
    <linearGradient id="c2Top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef0f0"/>
      <stop offset="100%" stop-color="#f5b8b8"/>
    </linearGradient>
    <linearGradient id="c2Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#efa3a3"/>
      <stop offset="100%" stop-color="#dc8282"/>
    </linearGradient>

    <!-- Conv 3: 16x16x128 3D Deep Prism -->
    <linearGradient id="c3Front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8e8"/>
      <stop offset="100%" stop-color="#f5b8b8"/>
    </linearGradient>
    <linearGradient id="c3Top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef0f0"/>
      <stop offset="100%" stop-color="#e89e9e"/>
    </linearGradient>
    <linearGradient id="c3Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db7474"/>
      <stop offset="100%" stop-color="#bf4747"/>
    </linearGradient>

    <!-- Dense 512 Column -->
    <linearGradient id="denseFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ed"/>
      <stop offset="100%" stop-color="#fae4b5"/>
    </linearGradient>
    <linearGradient id="denseTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fbe9bf"/>
    </linearGradient>
    <linearGradient id="denseSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebd097"/>
      <stop offset="100%" stop-color="#d9b674"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8a1c1c" />
    </marker>
  </defs>

  <!-- Clean Border Box -->
  <rect x="4" y="4" width="792" height="216" rx="7" fill="#ffffff" stroke="rgba(70, 40, 10, 0.12)" stroke-width="1"/>

  <!-- Top Header Bar -->
  <g transform="translate(18, 18)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="12.5" font-weight="700" fill="#1c1917" letter-spacing="-0.01em">FireCNN: 3D Volumetric Tensor Pipeline</text>
    <text x="0" y="13.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.8" font-weight="500" fill="#78716c" letter-spacing="0.03em">128×128×3 RGB ➔ 3 CONVOLUTION BLOCKS ➔ 512 LATENT VECTOR ➔ BINARY LOGIT</text>
    
    <!-- Sub-15ms badge -->
    <rect x="668" y="-9" width="98" height="17" rx="3" fill="rgba(138, 28, 28, 0.05)" stroke="rgba(138, 28, 28, 0.20)" stroke-width="1"/>
    <text x="717" y="2.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#8a1c1c" text-anchor="middle" letter-spacing="0.04em">SUB-15ms RUNTIME</text>
  </g>

  <!-- Flow Axis Guideline -->
  <line x1="20" y1="110" x2="780" y2="110" stroke="rgba(70, 40, 10, 0.04)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============================================================== -->
  <!-- 1. STAGE 00: INPUT TILE (128x128x3 RGB)                        -->
  <!-- Center: x=62                                                   -->
  <!-- ============================================================== -->
  <g>
    <!-- Header -->
    <text x="62" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#78716c" text-anchor="middle" letter-spacing="0.06em">STAGE 00</text>
    <text x="62" y="60" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">Input Tile</text>

    <!-- 3D Tensor Box: w=52, h=78, dx=12, dy=-7 -->
    <g filter="url(#shadow3d)">
      <!-- Top Face -->
      <polygon points="36,71 48,64 100,64 88,71" fill="url(#inputTop)" stroke="#b8aa94" stroke-width="1"/>
      <!-- Right Side Face -->
      <polygon points="88,71 100,64 100,142 88,149" fill="url(#inputSide)" stroke="#b8aa94" stroke-width="1"/>
      <!-- Front Face -->
      <rect x="36" y="71" width="52" height="78" rx="1.5" fill="url(#inputFront)" stroke="#b8aa94" stroke-width="1"/>
      
      <!-- Inner Grid -->
      <rect x="40" y="75" width="44" height="70" rx="1" fill="#fdfbf8" stroke="rgba(184, 170, 148, 0.45)" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="62" y="107" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">128×128</text>
      <text x="62" y="119" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#8c827a" text-anchor="middle">RGB</text>
    </g>

    <!-- Feature Map Info (Zero overflow, ample margin) -->
    <text x="62" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#8a1c1c" text-anchor="middle">3 Channels</text>
    <text x="62" y="181" font-family="-apple-system, sans-serif" font-size="7.5" fill="#78716c" text-anchor="middle">Raw Drone Sensor</text>
  </g>

  <!-- Flow Connector 0 -> 1 -->
  <g transform="translate(108, 110)">
    <polygon points="0,-4 0,4 28,3 28,-3" fill="rgba(138, 28, 28, 0.07)" stroke="rgba(138, 28, 28, 0.20)" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="32" y2="0" stroke="#8a1c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
    <text x="16" y="-7" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#8a1c1c" text-anchor="middle">Conv 3×3</text>
    <text x="16" y="12" font-family="'JetBrains Mono', monospace" font-size="6.8" fill="#78716c" text-anchor="middle">MaxPool</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. STAGE 01: CONV 1 (64x64x32)                                 -->
  <!-- Center: x=192                                                  -->
  <!-- ============================================================== -->
  <g>
    <!-- Header -->
    <text x="192" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#8a1c1c" text-anchor="middle" letter-spacing="0.06em">STAGE 01</text>
    <text x="192" y="60" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">Conv Block 1</text>

    <!-- 3D Tensor Box: w=44, h=64, dx=20, dy=-12 -->
    <g filter="url(#shadow3d)">
      <!-- Top Face -->
      <polygon points="170,78 190,66 234,66 214,78" fill="url(#c1Top)" stroke="#d47a7a" stroke-width="1"/>
      <!-- Right Side Face (32 channels depth) -->
      <polygon points="214,78 234,66 234,130 214,142" fill="url(#c1Side)" stroke="#d47a7a" stroke-width="1"/>
      <!-- Depth Slice Lines -->
      <line x1="221" y1="72" x2="221" y2="136" stroke="rgba(212, 122, 122, 0.45)" stroke-width="0.7"/>
      <line x1="227" y1="68" x2="227" y2="132" stroke="rgba(212, 122, 122, 0.45)" stroke-width="0.7"/>
      <!-- Front Face -->
      <rect x="170" y="78" width="44" height="64" rx="1.5" fill="url(#c1Front)" stroke="#d47a7a" stroke-width="1"/>
      
      <text x="192" y="107" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#8a1c1c" text-anchor="middle">64×64</text>
      <text x="192" y="119" font-family="'JetBrains Mono', monospace" font-size="7.2" font-weight="600" fill="#78716c" text-anchor="middle">Edges</text>
    </g>

    <!-- Feature Map Info -->
    <text x="192" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#8a1c1c" text-anchor="middle">32 Feature Maps</text>
    <text x="192" y="181" font-family="-apple-system, sans-serif" font-size="7.5" fill="#78716c" text-anchor="middle">896 parameters</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <g transform="translate(244, 110)">
    <polygon points="0,-4 0,4 28,3 28,-3" fill="rgba(138, 28, 28, 0.07)" stroke="rgba(138, 28, 28, 0.20)" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="32" y2="0" stroke="#8a1c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
    <text x="16" y="-7" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#8a1c1c" text-anchor="middle">Conv 3×3</text>
    <text x="16" y="12" font-family="'JetBrains Mono', monospace" font-size="6.8" fill="#78716c" text-anchor="middle">MaxPool</text>
  </g>

  <!-- ============================================================== -->
  <!-- 3. STAGE 02: CONV 2 (32x32x64)                                 -->
  <!-- Center: x=325                                                  -->
  <!-- ============================================================== -->
  <g>
    <!-- Header -->
    <text x="325" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#8a1c1c" text-anchor="middle" letter-spacing="0.06em">STAGE 02</text>
    <text x="325" y="60" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">Conv Block 2</text>

    <!-- 3D Tensor Box: w=38, h=52, dx=32, dy=-18 -->
    <g filter="url(#shadow3d)">
      <!-- Top Face -->
      <polygon points="304,84 336,66 374,66 342,84" fill="url(#c2Top)" stroke="#c25757" stroke-width="1"/>
      <!-- Right Side Face (64 channels depth) -->
      <polygon points="342,84 374,66 374,118 342,136" fill="url(#c2Side)" stroke="#c25757" stroke-width="1"/>
      <!-- Depth Slice Lines -->
      <line x1="350" y1="79" x2="350" y2="131" stroke="rgba(194, 87, 87, 0.45)" stroke-width="0.7"/>
      <line x1="358" y1="75" x2="358" y2="127" stroke="rgba(194, 87, 87, 0.45)" stroke-width="0.7"/>
      <line x1="366" y1="70" x2="366" y2="122" stroke="rgba(194, 87, 87, 0.45)" stroke-width="0.7"/>
      <!-- Front Face -->
      <rect x="304" y="84" width="38" height="52" rx="1.5" fill="url(#c2Front)" stroke="#c25757" stroke-width="1"/>
      
      <text x="323" y="108" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#8a1c1c" text-anchor="middle">32×32</text>
      <text x="323" y="119" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#78716c" text-anchor="middle">Texture</text>
    </g>

    <!-- Feature Map Info -->
    <text x="325" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#8a1c1c" text-anchor="middle">64 Feature Maps</text>
    <text x="325" y="181" font-family="-apple-system, sans-serif" font-size="7.5" fill="#78716c" text-anchor="middle">18.5K parameters</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <g transform="translate(382, 110)">
    <polygon points="0,-4 0,4 28,3 28,-3" fill="rgba(138, 28, 28, 0.07)" stroke="rgba(138, 28, 28, 0.20)" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="32" y2="0" stroke="#8a1c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
    <text x="16" y="-7" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#8a1c1c" text-anchor="middle">Conv 3×3</text>
    <text x="16" y="12" font-family="'JetBrains Mono', monospace" font-size="6.8" fill="#78716c" text-anchor="middle">MaxPool</text>
  </g>

  <!-- ============================================================== -->
  <!-- 4. STAGE 03: CONV 3 (16x16x128) - DEEP 3D VOLUMETRIC PRISM     -->
  <!-- Center: x=460                                                  -->
  <!-- ============================================================== -->
  <g>
    <!-- Header -->
    <text x="460" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#8a1c1c" text-anchor="middle" letter-spacing="0.06em">STAGE 03</text>
    <text x="460" y="60" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">Conv Block 3</text>

    <!-- 3D Tensor Prism: w=30, h=38, dx=50, dy=-24 (Deep 128 channels) -->
    <g filter="url(#shadow3d)">
      <!-- Top Face -->
      <polygon points="430,91 480,67 510,67 460,91" fill="url(#c3Top)" stroke="#a83232" stroke-width="1"/>
      <!-- Right Side Face (128 channels depth) -->
      <polygon points="460,91 510,67 510,105 460,129" fill="url(#c3Side)" stroke="#a83232" stroke-width="1"/>
      <!-- Depth Slice Lines simulating 128 channels -->
      <line x1="472" y1="85" x2="472" y2="123" stroke="rgba(168, 50, 50, 0.45)" stroke-width="0.7"/>
      <line x1="484" y1="79" x2="484" y2="117" stroke="rgba(168, 50, 50, 0.45)" stroke-width="0.7"/>
      <line x1="496" y1="74" x2="496" y2="112" stroke="rgba(168, 50, 50, 0.45)" stroke-width="0.7"/>
      <!-- Front Face (Clean 16x16 with dark red text) -->
      <rect x="430" y="91" width="30" height="38" rx="1.5" fill="url(#c3Front)" stroke="#a83232" stroke-width="1"/>
      
      <text x="445" y="114" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#8a1c1c" text-anchor="middle">16×16</text>
    </g>

    <!-- Feature Map Info (Zero overflow, perfectly centered in 130px column!) -->
    <text x="460" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#8a1c1c" text-anchor="middle">128 Feature Maps</text>
    <text x="460" y="181" font-family="-apple-system, sans-serif" font-size="7.5" fill="#78716c" text-anchor="middle">73.8K parameters</text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <g transform="translate(520, 110)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#8a1c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
    <text x="17" y="-7" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#b26818" text-anchor="middle">Flatten</text>
    <text x="17" y="12" font-family="'JetBrains Mono', monospace" font-size="6.8" font-weight="600" fill="#b26818" text-anchor="middle">Drop 0.5</text>
  </g>

  <!-- ============================================================== -->
  <!-- 5. STAGE 04: DENSE LATENT HEAD (512 UNITS)                     -->
  <!-- Center: x=585                                                  -->
  <!-- ============================================================== -->
  <g>
    <!-- Header -->
    <text x="585" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#b26818" text-anchor="middle" letter-spacing="0.06em">STAGE 04</text>
    <text x="585" y="60" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">Dense Head</text>

    <!-- 3D Column: w=16, h=80, dx=12, dy=-8 -->
    <g filter="url(#shadow3d)">
      <!-- Top Face -->
      <polygon points="577,70 589,62 605,62 593,70" fill="url(#denseTop)" stroke="#c99738" stroke-width="1"/>
      <!-- Right Side Face -->
      <polygon points="593,70 605,62 605,142 593,150" fill="url(#denseSide)" stroke="#c99738" stroke-width="1"/>
      <!-- Front Face -->
      <rect x="577" y="70" width="16" height="80" rx="1.5" fill="url(#denseFront)" stroke="#c99738" stroke-width="1"/>
      
      <!-- Neuron Segmentation Tick Marks -->
      <line x1="577" y1="86" x2="593" y2="86" stroke="#dab979" stroke-width="0.8"/>
      <line x1="577" y1="102" x2="593" y2="102" stroke="#dab979" stroke-width="0.8"/>
      <line x1="577" y1="118" x2="593" y2="118" stroke="#dab979" stroke-width="0.8"/>
      <line x1="577" y1="134" x2="593" y2="134" stroke="#dab979" stroke-width="0.8"/>
      
      <text x="585" y="113" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#8a4f0d" text-anchor="middle">512</text>
    </g>

    <!-- Latent Info -->
    <text x="585" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#b26818" text-anchor="middle">512 Units</text>
    <text x="585" y="181" font-family="-apple-system, sans-serif" font-size="7.5" fill="#78716c" text-anchor="middle">16.7M params</text>
  </g>

  <!-- Flow Connector 4 -> 5 -->
  <g transform="translate(620, 110)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#8a1c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
    <text x="17" y="-7" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#1e5c38" text-anchor="middle">Linear</text>
    <text x="17" y="12" font-family="'JetBrains Mono', monospace" font-size="6.8" fill="#78716c" text-anchor="middle">Sigmoid</text>
  </g>

  <!-- ============================================================== -->
  <!-- 6. STAGE 05: OUTPUT LOGIT (P(fire))                             -->
  <!-- Center: x=715                                                  -->
  <!-- ============================================================== -->
  <g>
    <!-- Header -->
    <text x="715" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#1e5c38" text-anchor="middle" letter-spacing="0.06em">STAGE 05</text>
    <text x="715" y="60" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1c1917" text-anchor="middle">Logit Output</text>

    <!-- 3D Decision Sphere with Radial Shading -->
    <g filter="url(#glowGreen)" transform="translate(715, 110)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#1e5c38" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="21" fill="rgba(30, 92, 56, 0.08)"/>
      <circle cx="-5" cy="-5" r="13" fill="rgba(255, 255, 255, 0.7)"/>
      
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#1e5c38" text-anchor="middle">P(fire)</text>
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#1e5c38" text-anchor="middle">0.0 to 1.0</text>
    </g>

    <!-- Output Info -->
    <text x="715" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#1e5c38" text-anchor="middle">1 Binary Logit</text>
    <text x="715" y="181" font-family="-apple-system, sans-serif" font-size="7.5" fill="#78716c" text-anchor="middle">513 parameters</text>
  </g>

</svg>